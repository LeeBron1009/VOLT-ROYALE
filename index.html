  {cls:'slc',vars:'--ac:#ff6b9d;--abg:radial-gradient(ellipse at 50% 100%,#5a1030,#14040a)',art:art('radial-gradient(ellipse at 50% 100%,#5a1030,#14040a)',ball(5,'#e63946')+ball(12,'#f4a261','#221400')+ball(19,'#e9c46a','#221400')+ball(27,'#2a9d8f')+ball(33,'#4cc9f0','#221400')+ball(46,'#7b6cf6')),en:'LOTTO · 6 / 49',h:'六合彩 LOTTO 6/49',p:'從 1 到 49 選 6 個號碼，開出 6 個。猜中 2 個就有獎，全中是 100,000 倍的大獎。',tags:['選 6 個','猜中 2 個有獎','超級大獎'],price:['每期 5 ~ 100','全中 100,000×'],note:'理論回報率約 95%',btn:'選號 ▶',go:()=>ngOpen(GAMES.lotto)}
 ]};
 const hub=document.querySelector('.hub');
 if(hub){
  const bank=hub.querySelector('.t-bank');
  const b=document.createElement('button');b.className='tile t-numbers';
  b.innerHTML='<div class="ti">🔢</div><div class="cnt">NUMBERS</div><h2>數字彩區</h2><p>Keno 數字彩<br>六合彩</p>';
  b.addEventListener('click',()=>zoneOpen('numbers'));
  if(bank)hub.insertBefore(b,bank);else hub.appendChild(b);
 }
 updateWallet();
}
build();
})();

/* ---------- 新分區：技能區（反應測試・記憶翻牌・射擊）---------- */
(function(){
const STEPS=[5,10,25,50,100];            // 技能遊戲單局最多 100
const fmt=n=>Math.round(n).toLocaleString();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const NOW=()=>performance.now();
/* ---- 獎金表（想調難度就改這裡）---- */
const PREVIEW_MS=2000;     // 記憶翻牌：開局先讓你看幾毫秒（2000 = 2 秒）。越短越難
const RX_TIERS=[[180,4],[210,2.5],[240,1.8],[270,1.3],[300,1],[330,.6],[380,.3]];   // 3 次平均反應時間(ms) → 倍數，超過最後一格 = 0
const MM_TIERS={0:2,1:1.6,2:1.3,3:1,4:.8,5:.6,6:.45,7:.3,8:.2,9:.1,10:.1};          // 失誤次數 → 倍數，更多 = 0
const SH_TIERS={18:3,19:3,20:3,17:2.5,16:2,15:1.7,14:1.4,13:1.1,12:.85,11:.65,10:.5,9:.35,8:.2,7:.1};   // 命中數 → 倍數
const rxMult=avg=>{for(const [ub,m] of RX_TIERS)if(avg<ub)return m;return 0};
const mmMult=miss=>MM_TIERS[miss]||0;
const shMult=h=>SH_TIERS[h]||0;
function injectCss(){
 if(!document.head)return;
 const st=document.createElement('style');
 st.textContent=`
.t-skill{border-color:rgba(120,255,160,.65);box-shadow:0 0 34px rgba(120,255,160,.2);background:linear-gradient(160deg,rgba(10,100,60,.6),rgba(12,16,34,.85))}.t-skill .ti{color:#78ffa0}
.tile:hover.t-skill{box-shadow:0 0 46px rgba(120,255,160,.5)}
.felt.bscroll{justify-content:flex-start;gap:10px;overflow-y:auto}.felt.bscroll::after,.felt.bscroll::before{display:none}
#rx-ctrl,#mm-ctrl,#sh-ctrl{max-height:46vh;overflow-y:auto}
.rxpad{width:min(100%,520px);height:min(46vh,300px);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;z-index:1;user-select:none;-webkit-user-select:none;touch-action:manipulation;cursor:pointer;transition:background .05s;text-align:center;padding:10px}
.rxpad.idle{background:#16305c}.rxpad.wait{background:#a8202f}.rxpad.go{background:#14b86a}.rxpad.show{background:#27408b}.rxpad.early{background:#c46a10}.rxpad.done{background:#2a1c5c}
.rxbig{font-size:clamp(30px,9vw,54px);font-weight:900;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.rxsub{font-size:14px;opacity:.9}
.mgrid4{display:grid;grid-template-columns:repeat(4,var(--cs));gap:8px;z-index:1}
.mc{width:var(--cs);height:var(--cs);border-radius:12px;border:2px solid rgba(255,255,255,.35);background:linear-gradient(145deg,#26407a,#142348);color:#fff;font-size:calc(var(--cs)*.5);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .15s}
.mc.up{background:#fff;color:#111;transform:rotateY(0)}.mc.done{background:#1fbf75;border-color:#fff;opacity:.85}.mc.peek{background:#fff7d6;border-color:#ffd166;box-shadow:0 0 14px rgba(255,209,102,.7)}
.mc:not(.up):not(.done):active{transform:scale(.94)}
.shcv{width:min(100%,360px);height:auto;border-radius:14px;background:rgba(0,0,0,.4);touch-action:none;z-index:1;cursor:crosshair}
.ptab{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;z-index:1;max-width:560px}
.ptab span{padding:4px 10px;border-radius:8px;background:rgba(0,0,0,.35);font-size:12px;border:1px solid rgba(255,255,255,.15)}
.ptab span.on{background:#1fbf75;border-color:#fff;font-weight:800}
.opt{padding:8px 12px;border-radius:999px;border:1px solid var(--gold);background:rgba(255,209,102,.08);color:var(--gold);font-weight:800;font-size:13px}
`;
 document.head.appendChild(st);
}
function mk(id,title,t){
 const d=document.createElement('div');d.id=id;d.className='tbl';
 d.innerHTML='<div class="bjbar"><button class="ib" id="'+id+'-back">⌂</button><div class="t" id="'+id+'-title">'+title+'</div><div style="display:flex;gap:8px;align-items:center"><div class="wchip">⚡<b class="w-chips">0</b></div><button class="ib bankbtn" data-openbank style="width:auto;padding:0 10px">🏦</button></div></div><div class="felt bscroll" id="'+id+'-felt" data-t="'+t+'"></div><div class="ctrl" id="'+id+'-ctrl"></div>';
 document.body.appendChild(d);TBLS.push(id);
 const ob=d.querySelector('[data-openbank]');if(ob)ob.addEventListener('click',()=>openBank());
 return d;
}
function setMsg(id,t,c){const e=$('#'+id);if(e){e.textContent=t;e.className='msg '+(c||'')}}
function stepBet(o,a){
 const i=STEPS.indexOf(o.bet),ch=chips();
 if(a==='dn'){if(i>0)o.bet=STEPS[i-1]}
 else if(a==='up'){if(i<STEPS.length-1&&STEPS[i+1]<=ch)o.bet=STEPS[i+1];else if(i<STEPS.length-1)toast('籌碼不夠再加');else toast('技能遊戲每局最多 100')}
 else if(a==='max'){let b=STEPS[0];for(const s of STEPS)if(s<=ch)b=s;o.bet=b}
}
function fitBet(o){const ch=chips();let b=STEPS[0];for(const s of STEPS)if(s<=Math.min(o.bet,Math.max(ch,5)))b=s;o.bet=b}
function betRow(o,dis,label){return '<div class="betline">'+(label||'押注')+' <b>'+fmt(o.bet)+'</b>　<span style="opacity:.7">籌碼 '+fmt(chips())+'</span></div><div class="row"><button class="btn" data-a="dn"'+(dis?' disabled':'')+'>－</button><button class="btn" data-a="max"'+(dis?' disabled':'')+'>MAX</button><button class="btn" data-a="up"'+(dis?' disabled':'')+'>＋</button></div>'}
function payTab(id,rows,cur){$('#'+id).innerHTML='<div class="ptab">'+rows.map(r=>'<span class="'+(cur===r[0]?'on':'')+'">'+r[1]+'</span>').join('')+'</div>'}

/* ===== 反應測試 ===== */
const RX={bet:10,phase:'bet',round:0,times:[],st:'idle',t0:0,tok:0};
function rxPaint(st,big,sub){const p=$('#rxpad');p.className='rxpad '+st;p.innerHTML='<div class="rxbig">'+big+'</div><div class="rxsub">'+(sub||'')+'</div>'}
function rxTable(cur){
 const rows=[];let prev=0;
 RX_TIERS.forEach(([ub,m],i)=>{rows.push([i,(i===0?'低於 ':prev+'~')+ub+'ms → ×'+m]);prev=ub});
 rows.push([RX_TIERS.length,'超過 '+prev+'ms → ×0']);
 payTab('rxpay',rows,cur);
}
function rxCtrl(){
 const busy=RX.phase==='play';
 $('#rx-ctrl').innerHTML=betRow(RX,busy)+'<div class="row"><button class="btn gold spinbtn" data-a="start"'+((busy||chips()<RX.bet)?' disabled':'')+'>開始 ▶</button></div>';
}
function rxStart(){
 if(RX.phase==='play')return;
 if(chips()<RX.bet){openBank('籌碼不足。');return}
 setChips(chips()-RX.bet);RX.phase='play';RX.round=0;RX.times=[];RX.tok++;rxCtrl();setMsg('rxmsg','','');rxTable(-1);rxNext();
}
function rxNext(){
 const tok=RX.tok;RX.round++;RX.st='wait';
 rxPaint('wait','等綠燈⋯','第 '+RX.round+' / 3 次　變綠才點，點太早算輸');
 setTimeout(()=>{
  if(tok!==RX.tok||RX.st!=='wait')return;
  RX.st='go';rxPaint('go','現在點！','');RX.t0=NOW();
  requestAnimationFrame(()=>{if(RX.st==='go')RX.t0=NOW()});
 },1200+Math.random()*2600);
}
function rxEnd(ret,msg,cls,pad,big,sub){
 RX.phase='bet';RX.st='idle';RX.tok++;
 if(ret>0)setChips(chips()+ret);
 rxPaint(pad,big,sub);
 const net=ret-RX.bet;
 setMsg('rxmsg',msg+'　'+signed(net),net>0?'win':net<0?'lose':'push');
 if(net>0)sfx('bonus');else sfx('drain');
 rxCtrl();
}
function rxPress(ts){
 if(RX.phase!=='play')return;
 if(RX.st==='wait'){rxEnd(0,'太早了！','lose','early','太早了！','綠燈還沒亮就點，這局輸掉');return}
 if(RX.st!=='go')return;
 const t=(ts&&ts<1e11)?ts:NOW(),rt=Math.round(t-RX.t0);
 if(rt<100){rxEnd(0,'太早了！','lose','early','太早了！','反應不可能這麼快');return}
 RX.times.push(rt);RX.st='shown';sfx('target');
 if(RX.times.length>=3){
  const avg=Math.round(RX.times.reduce((a,b)=>a+b,0)/3),m=rxMult(avg),ret=Math.round(RX.bet*m);
  let idx=RX_TIERS.findIndex(([ub])=>avg<ub);if(idx<0)idx=RX_TIERS.length;
  rxTable(idx);
  rxEnd(ret,'三次平均 '+avg+' ms → ×'+m,'','done',avg+' ms',RX.times.join(' / ')+' ms　×'+m);
 }else{
  rxPaint('show',rt+' ms','第 '+RX.times.length+' 次');
  const tok=RX.tok;setTimeout(()=>{if(tok===RX.tok&&RX.phase==='play')rxNext()},800);
 }
}

function mmTable(cur){
 const rows=[];let m=0;
 while(m<=12){
  const v=mmMult(m);let e=m;
  while(e+1<=12&&mmMult(e+1)===v&&v>0)e++;

function mmStart(){
 if(MM.phase!=='bet')return;
 if(chips()<MM.bet){openBank('籌碼不足。');return}
 setChips(chips()-MM.bet);
 const vals=[];for(let i=0;i<8;i++){vals.push(i);vals.push(i)}
 for(let i=vals.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[vals[i],vals[j]]=[vals[j],vals[i]]}
 MM.cards=vals.map(v=>({v,up:false,done:false}));MM.open=[];MM.miss=0;MM.pairs=0;MM.lock=false;MM.phase='preview';
 const tok=++MM.tok;let left=PREVIEW_MS;

function mmFlip(i){
 if(MM.phase!=='play'||MM.lock)return;

 c.up=true;MM.open.push(i);sfx('card');mmRender();
 if(MM.open.length<2)return;

  MM.cards[a].done=MM.cards[b].done=true;MM.cards[a].up=MM.cards[b].up=false;MM.pairs++;MM.open=[];MM.lock=false;sfx('target');mmRender();

 }else{
  MM.miss++;

 }
}

const SH_N=20,SH_R=28,SH_L0=900,SH_L1=450,SW=340,SHH=380;
const SH={bet:10,phase:'bet',i:0,hits:0,tg:null,raf:0,flash:null,start:0};
function shTable(cur){
 const rows=[[18,'18~20 中 → ×'+SH_TIERS[18]]];
 for(let h=17;h>=7;h--)rows.push([h,h+' 中 → ×'+SH_TIERS[h]]);
 rows.push([0,'6 以下 → ×0']);

}
function shSpawn(){
 if(SH.i>=SH_N){shFinish();return}
 const life=SH_L0-(SH_L0-SH_L1)*SH.i/(SH_N-1);
 SH.tg={x:SH_R+8+Math.random()*(SW-2*SH_R-16),y:SH_R+30+Math.random()*(SHH-2*SH_R-40),t0:NOW()+260,life};
}
function shDraw(now){
 const cv=$('#shcv'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,SW,SHH);
 ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
 for(let x=0;x<=SW;x+=34){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,SHH);ctx.stroke()}
 for(let y=0;y<=SHH;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(SW,y);ctx.stroke()}
 ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.textAlign='left';ctx.textBaseline='top';
 ctx.fillText(SH.phase==='play'?'第 '+Math.min(SH.i+1,SH_N)+' / '+SH_N+'　命中 '+SH.hits:'',10,8);
 const t=SH.tg;
 if(t&&now>=t.t0&&now<=t.t0+t.life){
  const left=1-(now-t.t0)/t.life;
  ctx.beginPath();ctx.arc(t.x,t.y,SH_R,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(t.x,t.y,SH_R*.72,0,7);ctx.fillStyle='#e63946';ctx.fill();
  ctx.beginPath();ctx.arc(t.x,t.y,SH_R*.4,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.beginPath();ctx.arc(t.x,t.y,SH_R*.16,0,7);ctx.fillStyle='#e63946';ctx.fill();
  ctx.beginPath();ctx.arc(t.x,t.y,SH_R+6,-Math.PI/2,-Math.PI/2+Math.PI*2*left);ctx.strokeStyle='#ffd166';ctx.lineWidth=4;ctx.stroke();
 }
 if(SH.flash&&now-SH.flash.t<350){
  const p=(now-SH.flash.t)/350;ctx.beginPath();ctx.arc(SH.flash.x,SH.flash.y,SH_R+p*24,0,7);ctx.strokeStyle=SH.flash.hit?'rgba(77,255,166,'+(1-p)+')':'rgba(255,107,129,'+(1-p)+')';ctx.lineWidth=4;ctx.stroke();
 }
}
function shLoop(){
 if(SH.phase!=='play')return;
 const now=NOW(),t=SH.tg;
 if(t&&now>t.t0+t.life){SH.flash={x:t.x,y:t.y,t:now,hit:false};SH.i++;shSpawn()}
 shDraw(now);
 SH.raf=requestAnimationFrame(shLoop);
}
function shTap(x,y){
 if(SH.phase!=='play')return;
 const now=NOW(),t=SH.tg;
 if(!t||now<t.t0||now>t.t0+t.life)return;
 if(Math.hypot(x-t.x,y-t.y)<=SH_R){SH.hits++;SH.flash={x:t.x,y:t.y,t:now,hit:true};sfx('target');SH.i++;shSpawn()}
}
function shFinish(){

 if(ret>0)setChips(chips()+ret);
 shTable(SH.hits);
 setMsg('shmsg','命中 '+SH.hits+' / '+SH_N+' → ×'+m+'　'+signed(net),net>0?'win':net<0?'lose':'push');
 if(net>0)sfx('bonus');else sfx('drain');
 shDraw(NOW());shCtrl();
}
function shStart(){
 if(SH.phase==='play')return;
 if(chips()<SH.bet){openBank('籌碼不足。');return}
 setChips(chips()-SH.bet);SH.phase='play';SH.i=0;SH.hits=0;SH.flash=null;shTable();setMsg('shmsg','準備⋯','');shCtrl();

}

function perms(d){const c={};d.forEach(x=>c[x]=(c[x]||0)+1);let p=1;for(let i=2;i<=d.length;i++)p*=i;Object.keys(c).forEach(k=>{for(let i=2;i<=c[k];i++)p/=i});return p}
const MAXL=10;
/* ---------- 由亂數產生開獎號碼（每個玩家算出來都一樣）---------- */
function makeResult(g,rnd,key){
 const r=seededRand(rnd+'|'+key);
 if(g.kind==='digit')return{digits:Array.from({length:g.D},()=>Math.floor(r()*10))};
 const nums=sample(g.N,g.draw+(g.sp?1:0),r);
 return{main:nums.slice(0,g.draw).sort((a,b)=>a-b),special:g.sp?nums[g.draw]:0,a2:g.area2?1+Math.floor(r()*g.area2):0};
}
function judge(g,line,res){
 if(g.kind==='digit'){
  const d=res.digits,m=line.mode,x=g.modes[m];
  if(m==='zheng')return line.digits.every((v,i)=>v===d[i])?{n:x.n,mult:x.x}:null;
  if(m==='dui')return (line.digits[0]===d[g.D-2]&&line.digits[1]===d[g.D-1])?{n:x.n,mult:x.x}:null;
  const a=line.digits.slice().sort().join(''),b=d.slice().sort().join('');
  return a===b?{n:x.n,mult:x.x/perms(line.digits)}:null;
 }
 const set=new Set(res.main);
 if(g.combo){const k=line.nums.length;if(!line.nums.every(n=>set.has(n)))return null;const t=g.tiers.find(t=>t.k===k);return t?{n:t.n,mult:t.x}:null}
 let m=line.nums.filter(n=>set.has(n)).length;
 if(g.fold)m=Math.min(m,12-m);
 let s=0;
 if(g.sp)s=line.nums.indexOf(res.special)>=0?1:0;
 if(g.area2)s=line.a2===res.a2?1:0;
 const t=g.tiers.find(t=>t.m===m&&t.s===s);
 return t?{n:t.n,mult:t.x}:null;
}
/* ---------- 彩券與開獎（存在本機，開獎時間一到自動對獎）---------- */
const tickets=()=>store.get('twt',[]);
const results=()=>store.get('twr',{});
async function getResult(game,day){
 const key=game+'|'+day,cache=results();
 if(cache[key])return cache[key];
 let rnd=null,round=0;
 if(TEST_FAST){rnd='TEST|'+key}
 else{round=roundOf(day);rnd=await drand(round)}
 if(!rnd)return null;
 const res=makeResult(G[game],rnd,game);res.round=round;res.rnd=String(rnd).slice(0,12);res.day=day;
 const c2=results();c2[key]=res;
 const ks=Object.keys(c2);if(ks.length>90){ks.sort((a,b)=>a.split('|')[1]<b.split('|')[1]?-1:1);ks.slice(0,ks.length-90).forEach(k=>delete c2[k])}
 store.set('twr',c2);return res;
}
const S={g:null,key:'',picks:[],a2:0,mode:'zheng',k:2,digits:[],lines:[],last:null,skip:false,busy:false,prac:null};
let settling=false;
async function settleAll(silent){
 if(settling)return;settling=true;
 try{
  let won=0,cnt=0;
  const ids=tickets().filter(t=>!t.done).map(t=>t.id);
  for(const id of ids){
   const tk=tickets().find(t=>t.id===id);if(!tk||tk.done)continue;
   const due=TEST_FAST?(Date.now()-tk.t>=20000):(Date.now()>=drawTime(tk.day)+15000);
   if(!due)continue;
   const res=await getResult(tk.game,tk.day);if(!res)continue;
   const g=G[tk.game];
   const out=tk.lines.map(l=>{const h=judge(g,l,res);return{hit:h&&{n:h.n,mult:h.mult},ret:h?Math.round(h.mult*tk.price):0}});
   const total=out.reduce((s,o)=>s+o.ret,0);
   const all=tickets(),cur=all.find(t=>t.id===id);if(!cur||cur.done)continue;
   cur.done=true;cur.out=out;cur.total=total;store.set('twt',all);       // 先標記已對獎，再發獎，避免重複領
   if(total>0)setChips(chips()+total);
   won+=total;cnt++;
  }
  if(cnt){
   if(!silent||won>0)toast('🎫 '+cnt+' 張彩券已開獎'+(won>0?'，中獎 +'+fmt(won)+' 籌碼！':'，這次沒中'));
   if(S.g&&typeof scr!=='undefined'&&scr==='tw')all_();
  }
 }catch(e){}
 finally{settling=false}
}

function randLine(){
 const g=S.g,r=Math.random;
 if(g.kind==='digit'){const n=S.mode==='dui'?2:g.D;return{mode:S.mode,digits:Array.from({length:n},()=>Math.floor(r()*10))}}
 return{nums:sample(g.N,need(),r),a2:g.area2?1+Math.floor(r()*g.area2):0};
}
function info(){
 const g=S.g;let rows='',rtp=0;
 if(g.kind==='digit'){
  const N=Math.pow(10,g.D);
  rows=Object.keys(g.modes).map(m=>{const x=g.modes[m];
   if(m==='zu'){const per=g.D===3?[[6,'三碼都不同'],[3,'有兩碼相同'],[1,'三碼一樣']]:[[24,'四碼都不同'],[12,'有一組相同'],[6,'兩組相同'],[4,'有三碼相同'],[1,'四碼一樣']];
    return per.map(([p,t])=>'<tr><td>'+x.n+'（'+t+'）</td><td>'+p+'/'+N+'</td><td>×'+Math.round(x.x/p*100)/100+'</td><td>'+fmt(x.x/p*g.price)+'</td></tr>').join('')}
   return '<tr><td>'+x.n+'</td><td>1/'+(m==='dui'?100:N)+'</td><td>×'+x.x+'</td><td>'+fmt(x.x*g.price)+'</td></tr>'}).join('');
  rtp=0.9;
 }else if(g.combo){
  rows=g.tiers.map(t=>{const p=comb(g.N-t.k,g.draw-t.k)/comb(g.N,g.draw);return '<tr><td>'+t.n+'</td><td>1/'+fmt(1/p)+'</td><td>×'+t.x+'</td><td>'+fmt(t.x*g.price)+'</td></tr>'}).join('');
  rtp=g.tiers.reduce((s,t)=>s+comb(g.N-t.k,g.draw-t.k)/comb(g.N,g.draw)*t.x,0)/g.tiers.length;
 }else{
  rows=g.tiers.map(t=>{const p=g.prob(t.m,t.s);rtp+=p*t.x;return '<tr><td>'+t.n+'<br><small style="opacity:.7">'+t.c+'</small></td><td>1/'+fmt(1/p)+'</td><td>×'+t.x+'</td><td>'+fmt(t.x*g.price)+'</td></tr>'}).join('');
 }
 openModal('<div class="panel"><h2>'+g.name+' 獎項表</h2><div class="hint">'+g.desc+(g.base?'<br>對獎依據：'+g.base:'')+'<br>每一注的理論回報率約 '+(rtp*100).toFixed(0)+'%。</div><div style="overflow-x:auto"><table style="min-width:0;margin-top:8px"><tr><th>獎項</th><th>機率</th><th>倍數</th><th>獎金(籌碼)</th></tr>'+rows+'</table></div><div class="btns"><button class="btn" data-bank="close">關閉</button></div></div>');
}

 const g=S.g;if(S.busy||!S.lines.length)return;

 if(cost>chips()){openBank('籌碼不足。');return}

 if(all.filter(t=>!t.done).length>=60){toast('待開獎的彩券太多了，先等開獎');return}

 setChips(chips()-cost);
 all.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),game:S.key,day,lines:S.lines.map(l=>JSON.parse(JSON.stringify(l))),price:g.price,t:Date.now(),done:false});

function act(a){
 const g=S.g;
 if(a==='info'){info();return}
 if(a==='mine'){allMine();return}
 if(a==='settle'){settleAll(false);return}
 if(a.indexOf('tk:')===0){ticketModal(a.slice(3));return}
 if(a==='prac'){practice();return}
 if(S.busy)return;
 if(a==='buy'){buy();return}
 if(a.indexOf('m:')===0){S.mode=a.slice(2);S.digits=[];pickArea();ctrl();return}
 if(a.indexOf('k:')===0){S.k=+a.slice(2);S.picks=[];pickArea();ctrl();return}
 if(a.indexOf('d:')===0){const [,c,d]=a.split(':');S.digits[+c]=+d;pickArea();ctrl();return}
 if(a.indexOf('a:')===0){S.a2=+a.slice(2);pickArea();ctrl();return}
 if(a.indexOf('n:')===0){
  const n=+a.slice(2),i=S.picks.indexOf(n);
  if(i>=0)S.picks.splice(i,1);else if(S.picks.length<need())S.picks.push(n);else{toast('這一注最多選 '+need()+' 個');return}
  pickArea();ctrl();return;
 }
 if(a.indexOf('rm:')===0){S.lines.splice(+a.slice(3),1);editor();ctrl();return}
 if(a==='clear'){S.lines=[];editor();ctrl();return}
 if(a==='again'){if(S.last&&!S.lines.length){S.lines=S.last.map(l=>JSON.parse(JSON.stringify(l)));editor();ctrl()}return}
 if(a==='add'){
  if(!lineOk()||S.lines.length>=MAXL)return;
  S.lines.push(g.kind==='digit'?{mode:S.mode,digits:S.digits.slice(0,S.mode==='dui'?2:g.D)}:{nums:S.picks.slice(),a2:S.a2});
  sfx('chip');S.picks=[];S.a2=0;S.digits=[];pickArea();editor();ctrl();return;
 }
 if(a==='q1'||a==='q5'){const n=Math.min(a==='q1'?1:5,MAXL-S.lines.length);for(let i=0;i<n;i++)S.lines.push(randLine());sfx('chip');editor();ctrl()}
}

/* ---------- 大廳背景 ---------- */
(function(){
 const c=$('#bg'),x=c.getContext('2d');let pts=[];
 function rs(){c.width=innerWidth;c.height=innerHeight;pts=Array.from({length:Math.min(70,Math.floor(innerWidth/18))},()=>({x:Math.random()*c.width,y:Math.random()*c.height,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4}))}
 rs();addEventListener('resize',rs);
 function f(){
  requestAnimationFrame(f);if(scr!=='lobby'&&scr!=='zone')return;
  x.fillStyle='#05060d';x.fillRect(0,0,c.width,c.height);
  const gl=x.createRadialGradient(c.width/2,0,0,c.width/2,0,c.height*.8);gl.addColorStop(0,'rgba(255,209,102,.12)');gl.addColorStop(1,'transparent');x.fillStyle=gl;x.fillRect(0,0,c.width,c.height);
  for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1}
  for(let i=0;i<pts.length;i++){
   for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);if(d<130){x.strokeStyle=(i%4===0?'rgba(255,209,102,':'rgba(0,240,255,')+(.15*(1-d/130))+')';x.beginPath();x.moveTo(pts[i].x,pts[i].y);x.lineTo(pts[j].x,pts[j].y);x.stroke()}}
   x.fillStyle=i%4===0?'rgba(255,209,102,.8)':'rgba(0,240,255,.7)';x.fillRect(pts[i].x-1.5,pts[i].y-1.5,3,3);
  }
 }
 f();
})();
